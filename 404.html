<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BURP - Brewers United for Real Potables</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which will cause the browser to render the correct page without a page refresh.
      var l = window.location;
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    </script>
  </head>
  <body>
    <!-- 
      Redirect to index.html with the original path as a query parameter.
      GitHub Pages doesn't natively support client-side routing for SPAs on refresh.
    -->
    <script type="text/javascript">
      window.location.href = "/burp/index.html?/" + window.location.pathname.replace("/burp/", "").replace(/&/g, '~and~') + window.location.search + window.location.hash;
    </script>
  </body>
</html>
